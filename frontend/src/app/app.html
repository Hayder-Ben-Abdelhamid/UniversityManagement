<div class="container">
  <h1>Gestion des Étudiants - University Management</h1>

  <!-- Formulaire d'ajout simple -->
  <div class="form-card">
    <h3>Ajouter un étudiant</h3>
    <form (submit)="addStudent()">
      <div class="form-group">
        <label>Nom :</label>
        <input type="text" [(ngModel)]="name" name="name" required placeholder="Entrer le nom">
      </div>

      <div class="form-group">
        <label>Email :</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="Entrer l'email">
      </div>

      <div class="form-group">
        <label>Niveau :</label>
        <input type="text" [(ngModel)]="level" name="level" required placeholder="Entrer le niveau">
      </div>

      <button type="submit" class="btn-submit">Ajouter</button>
    </form>
  </div>

  <!-- Liste des étudiants -->
  <div class="list-card">
    <h3>Liste des étudiants</h3>
    <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Email</th>
          <th>Niveau</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let student of students">
          <td>{{ student.name }}</td>
          <td>{{ student.email }}</td>
          <td>{{ student.level }}</td>
          <td>
            <button (click)="deleteStudent(student._id)" class="btn-delete">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
